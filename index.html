<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ça surf ?</title>
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
  <main>
    <h1>🌊 ça surf ?</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="search" type="button">Recherche</button>
      <button class="tab-btn" data-tab="spots" type="button">Spots</button>
    </div>

    <section id="tab-search" class="tab-panel">
      <div class="search-box">
        <input id="location-input" type="text" placeholder="Nom du spot ou de la ville (ex: Hossegor)" autocomplete="off">
        <ul id="suggestions" class="suggestions hidden"></ul>
      </div>

      <button id="geolocate-btn" class="geolocate-btn">📍 Utiliser ma position</button>

      <div id="status" class="status hidden"></div>

      <section id="result" class="result hidden">
        <div class="emoji" id="result-emoji">🌊</div>
        <div class="message" id="result-message">ça surf</div>
        <div class="spot-name" id="result-spot"></div>
        <div class="details" id="result-details"></div>
      </section>
    </section>

    <section id="tab-spots" class="tab-panel hidden">
      <ul id="spots-list" class="spots-list"></ul>
    </section>
  </main>

  <script src="app.js?v=__BUILD__"></script>
</body>
</html>
